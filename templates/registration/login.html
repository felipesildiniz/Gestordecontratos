{% extends "base.html" %}
{% block titulo %}Entrar — Gestor de Contratos{% endblock %}
{% block corpo %}
<main class="cartao-login">
  <h1>Gestor de Contratos</h1>
  <p class="subtitulo">Licitações</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.errors %}
      <p class="erro" role="alert">Usuário ou senha incorretos. Tente novamente.</p>
    {% endif %}
    <label for="{{ form.username.id_for_label }}">Usuário</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Senha</label>
    {{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="botao">Entrar</button>
  </form>
</main>
{% endblock %}
